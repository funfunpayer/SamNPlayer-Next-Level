[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samnplayer"
version = "2.0.0.dev0"
description = "SamNPlayer: funscript player, editor and generator (Python + C++, Qt interface)"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
samnplayer = "samn.__main__:main"

[tool.setuptools.packages.find]
# Only the Python package; native/ is built with CMake, tests/ is not shipped.
include = ["samn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-qt captures Qt log messages through a Python handler; Qt's FFmpeg
# decoder thread logs without holding the GIL and crashes it. Keep Qt logs
# on stderr instead.
addopts = "--no-qt-log"
