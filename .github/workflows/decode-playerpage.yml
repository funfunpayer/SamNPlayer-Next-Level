name: Decode PlayerPage
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.PlayerPage.zlib.b64.0'
      - 'docs/.PlayerPage.zlib.b64.1'
      - 'docs/.PlayerPage.zlib.b64.2'
      - 'docs/.PlayerPage.zlib.b64.3'
      - 'docs/.TrainingPage.zlib.b64.0'
      - 'docs/.TrainingPage.zlib.b64.1'
      - 'docs/.TrainingPage.zlib.b64.2'
      - 'docs/.TrainingPage.zlib.b64.3'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'zlib payload part b'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode PlayerPage and TrainingPage
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, zlib
          from pathlib import Path

          def decode(stem, markers):
              parts = [Path(f"docs/.{stem}.zlib.b64.{i}").read_text().strip() for i in range(4)]
              raw = zlib.decompress(base64.b64decode("".join(parts)))
              Path(f"app/qml/{stem}.qml").write_bytes(raw)
              for m in markers:
                  assert m in raw, f"{stem}: missing {m!r}"
              print(stem, len(raw), "bytes OK")

          decode("PlayerPage", [b"noVideoHint", b"emptyHome"])
          decode("TrainingPage", [b"bridge.drift"])

          agent = Path("docs/AGENT_STATE.md")
          ag = agent.read_text()
          old = "**Last update:** 22 Oct 2026, Cursor, branch `cursor/look-empty-open-polish-2c42` — Flow look + calm motion polish (Play drift/halo, empty bloom, transport pulse, tab/drop/glass/silk); crank/open logic untouched (`LOOK_FROM_08_ASSESSMENT.md`)."
          new = "**Last update:** 22 Oct 2026, Cursor, branch `cursor/look-empty-open-polish-2c42` — Flow look + motion round 2 (Training ring breathe, Library/Icon hover, feel-without-film float); crank/open untouched (`LOOK_FROM_08_ASSESSMENT.md`)."
          if old in ag:
              agent.write_text(ag.replace(old, new, 1))
              print("patched AGENT_STATE")
          else:
              print("AGENT_STATE already patched or unexpected")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/qml/PlayerPage.qml app/qml/TrainingPage.qml docs/AGENT_STATE.md
          git commit -m "Look: Training ring breathe, Library hover, film-hint float" || exit 0
          git push
