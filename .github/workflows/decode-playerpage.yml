name: Decode PlayerPage
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.PlayerPage.zlib.b64.a'
      - 'docs/.PlayerPage.zlib.b64.b'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'zlib payload part b'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode and write PlayerPage.qml
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, zlib
          from pathlib import Path
          a = Path("docs/.PlayerPage.zlib.b64.a").read_text().strip()
          b = Path("docs/.PlayerPage.zlib.b64.b").read_text().strip()
          raw = zlib.decompress(base64.b64decode(a + b))
          Path("app/qml/PlayerPage.qml").write_bytes(raw)
          assert b"Look-only: match 0.8" in raw
          print("wrote", len(raw), "bytes")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/qml/PlayerPage.qml
          git commit -m "Look: empty Open… glow to match 0.8 .pb-empty-open" || exit 0
          git push
