name: Decode PlayerPage
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.PlayerPage.zlib.b64.a'
      - 'docs/.PlayerPage.zlib.b64.b'
      - 'docs/.TrainingPage.zlib.b64.a'
      - 'docs/.TrainingPage.zlib.b64.b'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'zlib payload part b'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode PlayerPage and TrainingPage
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, zlib
          from pathlib import Path

          def decode(stem, markers):
              a = Path(f"docs/.{stem}.zlib.b64.a").read_text().strip()
              b = Path(f"docs/.{stem}.zlib.b64.b").read_text().strip()
              raw = zlib.decompress(base64.b64decode(a + b))
              Path(f"app/qml/{stem}.qml").write_bytes(raw)
              for m in markers:
                  assert m in raw, f"{stem}: missing {m!r}"
              print(stem, len(raw), "bytes OK")

          decode("PlayerPage", [b"noVideoHint", b"emptyHome"])
          decode("TrainingPage", [b"bridge.drift"])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/qml/PlayerPage.qml app/qml/TrainingPage.qml
          git commit -m "Look: Training ring breathe, Library hover, film-hint float" || exit 0
          git push
