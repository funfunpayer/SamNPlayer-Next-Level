name: Decode Curve Polish
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.generator.zlib.b64.4'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode curve polish files
        run: |
          set -euo pipefail
          python3 <<'DECODE'
          import base64, zlib, hashlib
          from pathlib import Path
          targets = [
            ("editor", "app/src/editor_controller.cpp", 3, "be1045f67060a4a2"),
            ("player", "app/qml/PlayerPage.qml", 4, "43d3eaa0aa567b51"),
            ("generator", "app/qml/GeneratorPage.qml", 5, "22bfae7ca6cfe162"),
          ]
          clean = []
          for key, dest, n, want in targets:
              parts = [Path(f"docs/.{key}.zlib.b64.{i}").read_text().strip() for i in range(n)]
              raw = zlib.decompress(base64.b64decode("".join(parts)))
              got = hashlib.sha256(raw).hexdigest()[:16]
              assert got == want, (dest, got, want)
              Path(dest).write_bytes(raw)
              print(dest, len(raw), got, "OK")
              clean += [f"docs/.{key}.zlib.b64.{i}" for i in range(n)]
          Path("/tmp/clean_list.txt").write_text("\n".join(clean))
          DECODE
      - name: Commit and clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/editor_controller.cpp app/qml/PlayerPage.qml app/qml/GeneratorPage.qml
          while IFS= read -r f; do git rm -f "$f" || true; done < /tmp/clean_list.txt
          git rm -f .github/workflows/decode-curve-polish.yml || true
          git commit -m "fix(look): sharp Play/Editor curves for painting" || exit 0
          git push
