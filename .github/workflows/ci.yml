name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # A missing native module must fail, never "SKIP" with exit 0.
      SAMN_NATIVE_REQUIRED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libpulse0: QtMultimedia links PulseAudio on Linux (import fails without it).
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0

      - name: Python packages
        run: python -m pip install -e ".[test]" pybind11

      - name: Build native (C++)
        shell: bash
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build native/build --config Release --parallel

      - name: Native parity tests
        shell: bash
        run: |
          if [ -d native/build/Release ]; then export PYTHONPATH=native/build/Release; else export PYTHONPATH=native/build; fi
          for t in native/tests/test_*.py; do
            echo "== $t"
            python "$t"
          done

      - name: Python and interface tests
        run: python -m pytest -q
