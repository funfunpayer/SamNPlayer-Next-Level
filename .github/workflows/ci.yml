name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The first Windows run builds OpenCV with vcpkg (about an hour); later
    # runs restore it from the cache.
    timeout-minutes: 120
    env:
      # A missing native module must fail, never "SKIP" with exit 0.
      SAMN_NATIVE_REQUIRED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt 6.7 from the Qt installer (FFmpeg multimedia backend), the version
      # releases are built with. Development also works with Qt 6.4+.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          modules: "qtmultimedia qtserialport qtwebsockets qtconnectivity"
          cache: true

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt Quick offscreen + multimedia runtime libraries.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
          # samn_vision (D-133): OpenCV with the contrib tracking module.
          sudo apt-get install -y libopencv-dev libopencv-contrib-dev

      # samn_vision on Windows: OpenCV with contrib (CSRT), dnn and FFmpeg from
      # vcpkg (ci/vcpkg/vcpkg.json), built once and kept in a binary cache.
      - name: vcpkg cache key (Windows)
        if: runner.os == 'Windows'
        id: vcpkg
        shell: bash
        run: echo "commit=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('ci/vcpkg/vcpkg.json') }}
          # A new runner image brings a new vcpkg commit; the older cache
          # still serves every package whose ABI hash did not change.
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.commit }}-
            vcpkg-${{ runner.os }}-

      - name: Python packages (bindings and parity tests)
        run: python -m pip install pybind11

      - name: Configure
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p .vcpkg-cache
            extra=(-DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
                   -DVCPKG_MANIFEST_DIR=ci/vcpkg -DVCPKG_TARGET_TRIPLET=x64-windows)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}" \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core tests (C++)
        run: ctest --test-dir build -C Release --output-on-failure

      # A test that crashes on Windows loses its buffered output; run the
      # failed app tests one function at a time to show where it stops.
      - name: App tests per function (on failure)
        if: failure()
        shell: bash
        run: |
          set +e  # keep going after a failing function
          for t in device_transports device_controller playback_output inspector_qml player_page_qml shell_qml generator_qml label_controller aitrain_qml; do
            exe=$(find build -name "${t}_test" -o -name "${t}_test.exe" | head -1)
            [ -n "$exe" ] || continue
            for f in $("$exe" -functions | sed 's/()//'); do
              "$exe" "$f" -silent > /dev/null 2>&1; rc=$?
              echo "$t::$f exit $rc"
              if [ $rc -ne 0 ]; then
                "$exe" "$f" -v1 -o "fail-$t-$f.txt,txt" > /dev/null 2>&1
                tail -60 "fail-$t-$f.txt"
              fi
            done
          done

      - name: Parity tests (Python bindings)
        shell: bash
        run: |
          if [ -d build/core/Release ]; then export PYTHONPATH=build/core/Release; else export PYTHONPATH=build/core; fi
          for t in core/python/tests/test_*.py ai/tests/test_*.py; do
            echo "== $t"
            python "$t"
          done

      # The app must start, load a script, render and quit cleanly.
      - name: App smoke test
        shell: bash
        run: |
          python -c "import json; json.dump({'actions':[{'at':i*100,'pos':(i*37)%101} for i in range(200)]}, open('smoke.funscript','w'))"
          exe=build/app/samnplayer; [ -f build/app/Release/samnplayer.exe ] && exe=build/app/Release/samnplayer.exe
          SAMN_SCREENSHOT=smoke.png SAMN_SCREENSHOT_DELAY_MS=2500 timeout 60 "$exe" smoke.funscript
          test -s smoke.png

      # A portable Windows build to try on a real PC (D-149): the app, the
      # vcpkg DLLs (OpenCV, FFmpeg) the build put beside it, Qt with its QML,
      # multimedia and Bluetooth parts, and the MSVC runtime.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist=dist/SamNPlayer2
          mkdir -p "$dist"
          cp build/app/Release/samnplayer.exe "$dist/SamNPlayer2.exe"
          cp build/app/Release/*.dll "$dist/"
          qt=$(cygpath -u "$QT_ROOT_DIR")
          "$qt/bin/windeployqt.exe" --release --qmldir app/qml --compiler-runtime --no-translations "$dist/SamNPlayer2.exe"
          cp LICENSE THIRD_PARTY.md ci/windows/README.txt "$dist/"
          # The student's training script runs in the Python the app sets up (D-155 step 5).
          mkdir -p "$dist/ai" && cp ai/train_student.py "$dist/ai/"
          # ONNX Runtime (MIT) carries its licence and notices with it.
          ort=build/_deps/onnxruntime-src
          cp "$ort/LICENSE" "$dist/ONNXRUNTIME_LICENSE.txt"
          cp "$ort/ThirdPartyNotices.txt" "$dist/ONNXRUNTIME_ThirdPartyNotices.txt"
          test -f "$dist/onnxruntime.dll"
          echo "Files: $(find "$dist" -type f | wc -l), size: $(du -sh "$dist" | cut -f1)"
          ls "$dist"

      # The package must run on its own: no Qt, vcpkg or build folder on the
      # PATH. It opens a script and a video, draws and quits; the log must not
      # name a library or media backend that failed to load.
      - name: Package smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cfg=$(mktemp -d)
          cd dist/SamNPlayer2
          # The real Windows platform, as on a PC: the package carries only that
          # plugin, and a missing one makes Qt wait on an error box.
          rc=0
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QT_ROOT_DIR -u QT_QPA_PLATFORM \
            PATH="/c/Windows/system32:/c/Windows:/usr/bin" SAMN_CONFIG_DIR="$cfg" \
            SAMN_SCREENSHOT="$GITHUB_WORKSPACE/package.png" SAMN_SCREENSHOT_DELAY_MS=4000 \
            /usr/bin/timeout 90 ./SamNPlayer2.exe "$GITHUB_WORKSPACE/smoke.funscript" "$GITHUB_WORKSPACE/tests/app/data/testpattern_4s.mp4" || rc=$?
          log="$cfg/logs/samnplayer2.log"
          [ -f "$log" ] && cat "$log" || echo "(no log written)"
          if [ "$rc" -ne 0 ]; then echo "::error::The package exited with $rc (124 = hung)."; exit 1; fi
          test -s "$GITHUB_WORKSPACE/package.png"
          if grep -Eiq "no QtMultimedia backends|could not be loaded|cannot load library|failed to load plugin|module .* is not installed" "$log"; then
            echo "::error::The package is missing a library or plugin (see the log above)."
            exit 1
          fi

      - name: Upload the package (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SamNPlayer2-windows-x64
          path: |
            dist/
            package.png
          retention-days: 14

  # Memory and undefined-behaviour checks of the core (no Qt). 0.7's native
  # layer had a heap-corrupting argument and a double free that only showed
  # far from their cause (LESSONS GD-23); this job catches such bugs early.
  sanitizers:
    name: Sanitizers (core, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: OpenCV (samn_vision)
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev libopencv-contrib-dev

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSAMN_BUILD_APP=OFF -DSAMN_BUILD_PYTHON=OFF \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Build
        run: cmake --build build --parallel --target core_tests vision_tests engine_tests

      - name: Core tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build/tests/core_tests
          ./build/tests/vision_tests
          ./build/tests/engine_tests

  # D-142: every part that runs work in parallel also runs under the Thread
  # Sanitizer. Suppressions (ci/tsan.supp) cover only FFmpeg and OpenCV,
  # which run their own threads and are not built with TSan.
  tsan:
    name: Thread sanitizer (engine runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: OpenCV (samn_vision)
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev libopencv-contrib-dev

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSAMN_BUILD_APP=OFF -DSAMN_BUILD_PYTHON=OFF \
            "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel --target engine_tests

      - name: Threaded engine tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/ci/tsan.supp
        run: ./build/tests/engine_tests -tc="generate*"
