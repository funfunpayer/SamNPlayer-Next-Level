name: Decode generator_qml_test
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.merge/tests__app__generator_qml_test.cpp.zlib.b64.1'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode generator_qml_test.cpp
        run: |
          set -euo pipefail
          python3 <<'DECODE'
          import base64, zlib, hashlib
          from pathlib import Path
          key = "tests__app__generator_qml_test"
          dest = Path("tests/app/generator_qml_test.cpp")
          n = 2
          want = "3565d6dbb57047a7"
          parts = [Path(f"docs/.merge/{key}.zlib.b64.{i}").read_text().strip() for i in range(n)]
          raw = zlib.decompress(base64.b64decode("".join(parts)))
          got = hashlib.sha256(raw).hexdigest()[:16]
          assert got == want, (got, want)
          dest.write_bytes(raw)
          print(dest, len(raw), got, "OK")
          Path("/tmp/clean_list.txt").write_text("\n".join(
            [f"docs/.merge/{key}.zlib.b64.{i}" for i in range(n)]
          ))
          DECODE
      - name: Commit decoded file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/app/generator_qml_test.cpp
          if [ -f /tmp/clean_list.txt ]; then
            while IFS= read -r f; do git rm -f --ignore-unmatch "$f" || true; done < /tmp/clean_list.txt
          fi
          git rm -f --ignore-unmatch .github/workflows/decode-generator-qml-test.yml || true
          git rm -f --ignore-unmatch docs/.merge/tests__app__generator_qml_test.cpp.zlib.b64.2 || true
          git rm -f --ignore-unmatch docs/.merge/part21.chunk.6 || true
          git commit -m "fix(test): sync generator_qml imageRect assert with main"
          git push
