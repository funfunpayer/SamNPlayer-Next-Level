# One-shot: merge origin/main so the PR is MERGEABLE (needed for pull_request CI).
name: Merge Main Into Look
on:
  push:
    branches: [cursor/look-empty-open-polish-2c42]
    paths: [docs/.merge-main-trigger]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/look-empty-open-polish-2c42

      - name: Merge main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main already contained"
          else
            if ! git merge --no-edit origin/main; then
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  docs/AGENT_STATE.md)
                    cp docs/AGENT_STATE.resolved.md docs/AGENT_STATE.md
                    git add docs/AGENT_STATE.md
                    ;;
                  app/qml/GeneratorPage.qml)
                    git checkout --theirs -- "$f"
                    python3 docs/.patch_generator_paint.py
                    git add app/qml/GeneratorPage.qml
                    ;;
                  *)
                    git checkout --theirs -- "$f"
                    git add "$f"
                    ;;
                esac
              done
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "still conflicted:" >&2
                git diff --name-only --diff-filter=U >&2
                exit 1
              fi
              git commit -m "merge: origin/main into look polish (resolved)"
            fi
          fi
          rm -f docs/.merge-main-trigger docs/AGENT_STATE.resolved.md \
                docs/.patch_generator_paint.py \
                .github/workflows/merge-main-into-look.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: drop one-shot merge-main helper"
          fi
          git push origin HEAD:cursor/look-empty-open-polish-2c42
