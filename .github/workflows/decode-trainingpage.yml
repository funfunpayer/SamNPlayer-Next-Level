name: Decode TrainingPage
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.TrainingPage.zlib.b64.3'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode TrainingPage
        run: |
          set -euo pipefail
          python3 <<'DECODE'
          import base64, zlib
          from pathlib import Path
          parts = [Path(f"docs/.TrainingPage.zlib.b64.{i}").read_text().strip() for i in range(4)]
          raw = zlib.decompress(base64.b64decode("".join(parts)))
          Path("app/qml/TrainingPage.qml").write_bytes(raw)
          assert b"no opacity pulse" in raw
          bridge = raw[raw.find(b"silkBridge"):raw.find(b"silkBridge")+900]
          assert b"SequentialAnimation on opacity" not in bridge
          print("TrainingPage.qml", len(raw), "OK")
          DECODE
      - name: Commit and clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/qml/TrainingPage.qml
          git rm -f docs/.TrainingPage.zlib.b64.0 docs/.TrainingPage.zlib.b64.1 docs/.TrainingPage.zlib.b64.2 docs/.TrainingPage.zlib.b64.3 .github/workflows/decode-trainingpage.yml docs/.patch-training-silk-bridge .github/workflows/patch-training-silk-bridge.yml || true
          git commit -m "fix(Training): clear ring gauges again (mockup look)" || exit 0
          git push
