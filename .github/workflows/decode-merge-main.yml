name: Decode Merge Main
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.merge/docs__PARITY.md.zlib.b64.34'
      - 'docs/.merge/part21.chunk.6'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode merge files
        run: |
          set -euo pipefail
          python3 <<'DECODE'
          import base64, zlib, hashlib
          from pathlib import Path
          # Rebuild part 21 from verified chunks if present (avoids MCP single-char corruption).
          chunk_dir = Path('docs/.merge')
          chunks = [chunk_dir / f'part21.chunk.{i}' for i in range(7)]
          if all(p.exists() for p in chunks):
              rebuilt = ''.join(p.read_text().strip() for p in chunks)
              assert len(rebuilt) == 3500, len(rebuilt)
              want21 = 'b27100f5a737cab4'
              got21 = hashlib.sha256(rebuilt.encode()).hexdigest()[:16]
              assert got21 == want21, (got21, want21)
              Path('docs/.merge/docs__PARITY.md.zlib.b64.21').write_text(rebuilt)
              print('rebuilt part 21 from chunks', got21, 'OK')
          # MCP push_files sometimes flips single chars; force known-good bytes.
          fixes = {
              27: [(3070, '1')],  # W3uk -> W1uk
          }
          for i, edits in fixes.items():
              p = Path(f'docs/.merge/docs__PARITY.md.zlib.b64.{i}')
              chars = list(p.read_text())
              for idx, ch in edits:
                  chars[idx] = ch
              p.write_text(''.join(chars))
              print(f'applied fix part {i}', edits)
          targets = [('docs__PARITY.md', 'docs/PARITY.md', 35, '75cdb054ab981329')]
          clean = []
          for key, dest, n, want in targets:
              parts = [Path(f"docs/.merge/{key}.zlib.b64.{i}").read_text().strip() for i in range(n)]
              raw = zlib.decompress(base64.b64decode("".join(parts)))
              got = hashlib.sha256(raw).hexdigest()[:16]
              assert got == want, (dest, got, want)
              Path(dest).write_bytes(raw)
              print(dest, len(raw), got, "OK")
              clean += [f"docs/.merge/{key}.zlib.b64.{i}" for i in range(n)]
              clean += [f"docs/.merge/part21.chunk.{i}" for i in range(7)]
          Path("/tmp/clean_list.txt").write_text("\n".join(clean))
          DECODE
      - name: Commit decoded files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PARITY.md
          if [ -f /tmp/clean_list.txt ]; then
            while IFS= read -r f; do git rm -f --ignore-unmatch "$f" || true; done < /tmp/clean_list.txt
          fi
          git rm -f --ignore-unmatch .github/workflows/decode-merge-main.yml || true
          git commit -m "chore: decode merge PARITY.md from zlib parts"
          git push
