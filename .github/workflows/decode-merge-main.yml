name: Decode Merge Main
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/.merge/tests__app__generator_qml_test.cpp.zlib.b64.2'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/look-empty-open-polish-2c42
      - name: Decode merge files
        run: |
          set -euo pipefail
          python3 <<'DECODE'
          import base64, zlib, hashlib
          from pathlib import Path
          targets = [('app__qml__GeneratorPage.qml', 'app/qml/GeneratorPage.qml', 7, '3382f9b79c1b12a9'), ('app__src__generator_controller.cpp', 'app/src/generator_controller.cpp', 4, 'ad7c63204b73a484'), ('app__src__generator_controller.h', 'app/src/generator_controller.h', 2, 'c2d2facf4f70297e'), ('docs__AGENT_STATE.md', 'docs/AGENT_STATE.md', 4, 'fe62953a77e9749e'), ('tests__app__generator_controller_test.cpp', 'tests/app/generator_controller_test.cpp', 2, '7142f7915e900786'), ('tests__app__generator_qml_test.cpp', 'tests/app/generator_qml_test.cpp', 3, 'a2b230ecd21bb63b')]
          clean = []
          for key, dest, n, want in targets:
              parts = [Path(f"docs/.merge/{key}.zlib.b64.{i}").read_text().strip() for i in range(n)]
              raw = zlib.decompress(base64.b64decode("".join(parts)))
              got = hashlib.sha256(raw).hexdigest()[:16]
              assert got == want, (dest, got, want)
              Path(dest).write_bytes(raw)
              print(dest, len(raw), got, "OK")
              clean += [f"docs/.merge/{key}.zlib.b64.{i}" for i in range(n)]
          Path("/tmp/clean_list.txt").write_text("\n".join(clean))
          DECODE
      - name: Commit merge files and clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/qml/GeneratorPage.qml app/src/generator_controller.cpp app/src/generator_controller.h docs/AGENT_STATE.md tests/app/generator_controller_test.cpp tests/app/generator_qml_test.cpp
          while IFS= read -r f; do git rm -f "$f" || true; done < /tmp/clean_list.txt
          git rm -f .github/workflows/decode-merge-main.yml || true
          git rm -f docs/.generator.zlib.b64.4 || true
          git commit -m "merge: main into look polish (resolve AGENT_STATE)" -m "Keep sharp Play/Editor curve notes; fold Generator lane handoff from main." || exit 0
          git push
